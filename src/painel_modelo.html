<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}}</title>
<style>
:root{--fundo:#F3F3F1;--cartao:#FFFFFF;--borda:#E2E1DC;--grade:#ECEBE7;--texto:#0B0B0B;--sec:#52514E;--fraco:#8A8984;
--bom:#0E7A28;--ruim:#C42B2B;--azul:#2A78D6;--azulc:#E8F0FB;--lic:#6250D6;--alerta:#FFF3D6;--alertat:#7A4B00}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
header{background:var(--cartao);border-bottom:1px solid var(--borda);padding:10px 20px}
.l1{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.perbox{margin-left:auto;color:var(--sec);font-size:13px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.perbox[hidden]{display:none}
.perbox select{min-width:0;font:inherit;font-weight:600;color:var(--texto);padding:6px 10px;border:1px solid var(--borda);border-radius:8px;background:var(--cartao);max-width:100%}
@media(max-width:700px){.perbox{margin-left:0;width:100%}.perbox select{flex:1}}
h1{font-size:22px;font-weight:600;margin:0;display:flex;gap:18px}
h1 .ar{cursor:pointer;color:#A6ABB5;border-bottom:3px solid transparent;padding-bottom:2px}
h1 .ar.on{color:var(--texto);border-bottom-color:var(--azul);cursor:default}
h1 .ar:not(.on):hover{color:var(--sec)}
nav{display:flex;gap:18px;margin-left:10px}
nav button{border:0;background:transparent;color:var(--sec);padding:6px 2px;border-bottom:2px solid transparent;border-radius:0}
nav button.on{color:var(--texto);font-weight:600;border-bottom-color:var(--texto)}
.selo{padding:5px 4px;font-weight:600;font-size:12.5px;border:0;background:none}
.selo.ok{color:var(--bom)}.selo.erro{background:#FBE6E6;color:var(--ruim);padding:5px 12px;border-radius:14px}
.sub{color:var(--sec);font-size:12.5px;margin-top:4px}
.alerta{background:var(--alerta);color:var(--alertat);font-weight:600;padding:8px 20px}
main{padding:14px 24px 20px;max-width:1700px;margin:0 auto}
.caixa{background:var(--cartao);border:1px solid var(--borda);border-radius:10px;padding:12px 16px}
.filtros .lin{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.rot{color:var(--sec);margin-right:2px}
.grupo{display:flex;align-items:center;gap:6px;margin-right:16px}
.chip{border:1px solid var(--borda);background:#fff;border-radius:6px;padding:5px 12px;color:var(--texto)}
.chip.on{color:#fff;font-weight:600}
.vsel{position:relative}
.sala .lin{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.vchip{display:inline-flex;align-items:center;gap:4px;background:#E8F0FB;color:#1B4F9C;border-radius:16px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600}
.vchip button{border:0;background:transparent;color:#1B4F9C;font-size:16px;line-height:1;cursor:pointer;padding:0 4px;border-radius:50%}
.vchip button:hover{background:#cfe0f7}
.ssel>button{border:1px dashed var(--borda);background:var(--cartao);border-radius:16px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
.sec{color:var(--sec)}
.sala{margin-bottom:12px}
.vsel>button{border:1px solid var(--borda);background:#fff;border-radius:6px;padding:5px 12px;min-width:210px;text-align:left}
.vsel>button.on{color:var(--azul);font-weight:600}
.vmenu{position:absolute;z-index:10;top:36px;left:0;background:#fff;border:1px solid var(--borda);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:6px;min-width:250px;max-height:340px;overflow:auto}
.vmenu label{display:block;padding:5px 8px;border-radius:5px;cursor:pointer;white-space:nowrap}.vmenu label:hover{background:#F7F7F5}
input[type=search]{font:inherit;padding:5px 9px;border:1px solid var(--borda);border-radius:6px;width:230px}
.chk{color:var(--lic);display:flex;align-items:center;gap:5px;cursor:pointer;margin-right:16px}
.limpar{color:var(--azul);text-decoration:underline;background:none;border:0;padding:0}
.frase{background:#F7F7F5;border-radius:6px;padding:7px 12px;margin-top:10px;font-size:14.5px}
.frase b{font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:12px 0}
.card{background:var(--cartao);border:1px solid var(--borda);border-radius:10px;padding:10px 16px;position:relative}
.card.clic{cursor:pointer}.card.apagado{color:var(--fraco)}.card.apagado .rot2,.card.apagado .det{color:var(--fraco)}
.card .rot2{color:var(--sec);font-size:13px;display:flex;align-items:center;gap:6px}
.card .val{font-size:21px;font-weight:600;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .det{color:var(--sec);font-size:12px;padding-right:64px}
.ponto{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.duas{display:grid;grid-template-columns:minmax(0,52fr) minmax(0,48fr);gap:16px}
@media(max-width:1000px){.duas{grid-template-columns:minmax(0,1fr)}}
.cab{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.cab h2{font-size:16px;font-weight:600;margin:0}.cab .exp{margin:2px 0 0}
.exp{color:var(--sec);font-size:12.5px}
.toggle{margin-left:auto;display:flex}.toggle button{border:1px solid var(--borda);background:#fff;padding:4px 12px;font-size:12.5px}
.toggle button.on{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600}
.legenda{display:flex;gap:14px;flex-wrap:wrap;color:var(--sec);font-size:12px;margin:2px 0 6px}
.legenda span{display:flex;align-items:center;gap:5px}.legenda i{width:11px;height:11px;display:inline-block}
.vl{display:grid;grid-template-columns:minmax(150px,38%) minmax(0,1fr) 64px;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.vl:hover{background:#F7F7F5}.vl.sel{background:var(--azulc)}.vl.sel .nm{color:var(--azul);font-weight:600}.vl.ap{opacity:.42}
.vl .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl small{display:block;color:var(--sec);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trilho{display:flex;align-items:center;gap:8px;min-width:0}.seg{display:flex;height:16px;gap:2px;flex:none}
.trilho .v{font-weight:600;white-space:nowrap}
.var{text-align:right;font-size:12px;font-weight:600}
.up{color:var(--bom)}.down{color:var(--ruim)}.neu{color:var(--sec)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--grade);text-align:left;white-space:nowrap}
th{background:#F7F7F5;font-weight:600;position:sticky;top:0}
td.n,th.n{text-align:right}
tr.clic{cursor:pointer}tr.clic:hover td{background:#F7F7F5}
tr.sel td{background:var(--azulc)}tr.ap td{color:var(--fraco)}
tr.lic td{color:var(--lic)}
tr.tot td{font-weight:600;background:#F7F7F5}
.tabela{border:1px solid var(--borda);border-radius:8px;overflow:auto;max-height:62vh}
.duas .tabela td:first-child,.duas .tabela td:nth-child(2){max-width:190px;overflow:hidden;text-overflow:ellipsis}
.heat{border-radius:4px;padding:4px 8px;display:inline-block;min-width:100px;text-align:right}
.voltar{background:none;border:0;color:var(--azul);padding:0;margin-left:10px}
.ok{color:var(--bom)}.erro{color:var(--ruim)}
.faixa{padding:10px 14px;border-radius:8px;font-weight:600;margin-bottom:12px}
.faixa.ok{background:#E3F1E6}.faixa.erro{background:#FBE6E6}
/* ---- fluxo: pílulas · número grande · Vendedores|Clientes ---- */
.pills{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:12px}
.pill{background:#fff;border:1px solid var(--borda);border-radius:18px;padding:6px 14px;font:inherit;font-size:13.5px;color:var(--texto)}
.pill.on{border-color:var(--azul);color:var(--azul)}
.pill.busca{width:260px}
.pill.chk{display:flex;align-items:center;gap:6px;color:var(--lic);cursor:pointer}
.pills .frase{background:none;margin:0;padding:0;color:var(--sec);font-size:13.5px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;margin-bottom:16px}
.hero.sem-lic{grid-template-columns:minmax(0,1fr)}
.big,.licc,.corpo{background:#fff;border:1px solid var(--borda);border-radius:12px}
.big{padding:16px 24px 18px}
.big .rot,.licc .rot{color:var(--sec);font-size:13px}
.big .num{font-size:34px;font-weight:600;letter-spacing:-.5px;margin:2px 0}
.big .num .var{font-size:15px;letter-spacing:0}.big .num .vs{font-size:12.5px;font-weight:400;color:var(--sec);letter-spacing:0}
.big .det,.licc .det{color:var(--sec);font-size:12.5px}
.share{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin:16px 0 10px;background:var(--grade)}
.share i{cursor:pointer;min-width:2px}
.leg{display:flex;flex-wrap:wrap;gap:8px 40px}
.leg>div{cursor:pointer}.leg>div.ap{opacity:.4}.leg>div.on .n{color:var(--azul);font-weight:600}
.leg .n{font-size:12px;color:var(--sec);display:flex;align-items:center;gap:6px}
.leg .x{font-size:16px;font-weight:600}.leg .x small{font-size:12px;margin-left:6px}
.licc{padding:16px 24px;border-left:5px solid var(--lic);cursor:pointer}
.licc .rot{color:var(--lic);font-weight:600}.licc .num2{font-size:27px;font-weight:600;margin:4px 0}
.licc .lnk{color:var(--lic);text-decoration:underline;font-size:13px;margin-top:12px}
.corpo{padding:4px 22px 14px}
.ch{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--grade);margin-bottom:6px;flex-wrap:wrap}
.tabs2{display:flex;gap:18px}
.tabs2 button{border:0;background:none;font-size:17px;font-weight:600;color:#A6ABB5;padding:10px 0 8px;border-bottom:3px solid transparent}
.tabs2 button.on{color:var(--texto);border-bottom-color:var(--azul)}
.mig{flex:1;min-width:0;color:var(--sec);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mig a{color:var(--azul);cursor:pointer}.mig b{color:var(--texto)}
.lista .vl{display:grid;grid-template-columns:28px minmax(120px,22%) minmax(0,1fr) 130px 70px;gap:0 10px;align-items:center;height:40px;padding:0 6px;border-top:1px solid var(--grade);border-radius:0;cursor:pointer}
.lista .vl:first-child{border-top:0}
.lista .vl:hover{background:#F7F7F5}.lista .vl.ab{background:var(--azulc)}.lista .vl.ab .nm{color:var(--azul);font-weight:600}
.pos{color:var(--fraco);font-weight:600;font-size:13px}
.lista .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista .trilho{display:block;min-width:0}.lista .seg{display:flex;gap:2px;height:14px;max-width:100%}
.lista .v{text-align:right;font-weight:600;white-space:nowrap}
.bloco{background:#FAFBFC;border-top:1px solid #DCE8F8;border-bottom:1px solid #DCE8F8;padding:8px 6px 10px calc(28px + 22% + 26px)}
.bloco .info{color:var(--sec);font-size:12.5px;margin-bottom:4px}
.bloco .cl{display:grid;grid-template-columns:minmax(0,1fr) 54px 130px 70px;gap:0 10px;align-items:center;height:28px;font-size:13px;cursor:pointer;border-radius:4px;padding-right:6px}
.bloco .cl:hover{background:#EEF3FA}.bloco .cl.lic{color:var(--lic)}
.bloco .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bloco small{color:var(--fraco);font-size:11.5px;margin-left:6px}
.bloco .pc{text-align:right;color:var(--sec);font-size:12.5px}.bloco .v{text-align:right}
.mais{border:0;background:none;color:var(--azul);text-decoration:underline;padding:6px 0 0;font-size:13px}
td.pos{width:28px}
.dica{color:var(--sec)}
@media(max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}.big .num{font-size:26px}
 .lista .vl{grid-template-columns:22px minmax(0,1fr) 110px 54px;height:auto;min-height:40px;padding:6px 4px}.lista .vl .trilho{display:none}
 .bloco{padding-left:10px}.bloco .cl{grid-template-columns:minmax(0,1fr) 100px 62px}.bloco .pc{display:none}.var{white-space:nowrap}
 .pill.busca{width:100%}.mig{flex-basis:100%;order:3}.corpo{padding:4px 12px 12px}}
footer{color:var(--fraco);font-size:12px;padding:0 20px 20px;max-width:1700px;margin:0 auto}
@media(max-width:700px){main{padding:10px}.grupo{flex-wrap:wrap;margin-right:0}.cards{grid-template-columns:1fr 1fr;gap:8px}.card .val{font-size:16px}.vl{grid-template-columns:42% minmax(0,1fr) 50px}input[type=search]{width:100%}}
</style>
</head>
<body>
<header>
  <div class="l1"><h1 id="areas"></h1><nav id="abas"></nav><button id="selo" class="selo" hidden></button>
    <label id="perbox" class="perbox" hidden>Ver o período <select id="per" onchange="trocarPeriodo(this.value)"></select></label></div>
  <div class="sub" id="sub"></div>
</header>
<div class="alerta" id="alerta" hidden></div>
<main id="conteudo"></main>
<footer>Gerado pelo Painel de Pedidos a partir dos PDFs <span id="relatorio"></span>. Este arquivo é uma foto dos dados: não se atualiza sozinho.</footer>
<script>
const DADOS = /*DADOS*/null;
// várias ÁREAS no mesmo arquivo (Vendas e Faturamento); cada uma com os seus dados
const AREAS = (DADOS.areas || [{titulo:'{{TITULO}}', relatorio:'{{RELATORIO}}', notas:/*NOTAS*/false, empresas:DADOS.empresas, anteriores:DADOS.anteriores}])
  .map(a => a.periodos ? a : Object.assign(a, {periodos:[{nome:'', empresas:a.empresas, anteriores:a.anteriores}], pinicial:0}));
AREAS.forEach(a => a.pver = a.pinicial || 0);   // período visto em cada área
let D, NOTAS, ITENS, TODOS, ANT, EMP, TEM_ANT, EMP_ANT, TEM_LIC, COMP_TXT = '', areaAtual = 0;
// datas dd/mm/aaaa dentro de um texto (k = qual delas)
function dt(s, k){ const m = String(s||'').match(/\d{2}\/\d{2}\/\d{4}/g); if(!m || m.length <= k) return null; const [d,mo,a] = m[k].split('/').map(Number); return new Date(a, mo-1, d); }
const fmtD = (d, ano) => String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + (ano ? '/' + d.getFullYear() : '');
// ▲▼ justo com o período em andamento: compara com os MESMOS DIAS do período anterior
function cortarAnterior(){
  const cortes = {}, txt = [];
  (D.anteriores||[]).forEach(an => {
    const at = D.empresas.find(e => e.curta === an.curta);
    let t = an.periodo;
    if(at){
      const iAt = dt(at.periodo,0), fAt = dt(at.periodo,1), iAn = dt(an.periodo,0), fAn = dt(an.periodo,1);
      const ref = dt(at.emissao,0) || dt(DADOS.gerado,0);
      if(iAt && fAt && iAn && fAn && ref && ref >= iAt && ref < fAt){
        const corte = new Date(iAn.getTime() + Math.round((ref - iAt) / 864e5) * 864e5);
        if(corte < fAn){ cortes[an.curta] = corte; t = fmtD(iAn) + ' a ' + fmtD(corte, true) + ' (mesmos dias)'; }
      }
    }
    if(t && !txt.includes(t)) txt.push(t);
  });
  if(Object.keys(cortes).length) ANT = ANT.filter(p => { const c = cortes[p.emp], d = dt(p.data,0); return !c || !d || d <= c; });
  COMP_TXT = txt.join(' / ');
}

const brl = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const n3 = new Intl.NumberFormat('pt-BR', {minimumFractionDigits:3, maximumFractionDigits:3});
const R = v => brl.format(v), Q = v => n3.format(v), P1 = v => v.toFixed(1).replace('.', ',');
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soma = a => a.reduce((s,p) => s + p.val, 0);
const nCli = n => n + (n === 1 ? ' cliente' : ' clientes');
const CORES = ['#2A78D6','#EB6834','#1BAF7A','#6250D6','#E87BA4','#EDA100'];
function cor(nome){ const n = norm(nome); if(n.includes('ALFA')) return CORES[0]; if(n.includes('BETA')) return CORES[1]; if(n.includes('GAMA')) return CORES[2]; return CORES[3 + EMP.indexOf(nome) % 3]; }

// pedidos "achatados": um objeto por pedido
function achatar(lista){
  const r = [];
  (lista||[]).forEach(e => e.vend.forEach(v => v.p.forEach(p => r.push({
    emp:e.curta, vk:norm(v.n), vend:v.n, num:p[0], data:p[1], cod:p[2], cli:p[3], ck:norm(p[3]), qtd:p[4], val:p[5], lic:!!p[6]
  }))));
  return r;
}
function usarArea(i){
  areaAtual = i; const a = AREAS[i];
  const pe = a.periodos[Math.min(a.pver, a.periodos.length-1)];
  D = {gerado:DADOS.gerado, empresas:pe.empresas||[], anteriores:pe.anteriores||[]};
  const sel = document.getElementById('per');
  sel.innerHTML = a.periodos.map((p,k) => `<option value="${k}" ${k===a.pver?'selected':''}>${esc(p.nome)}${k===0?'  (mais recente)':''}</option>`).join('');
  document.getElementById('perbox').hidden = a.periodos.length < 2;
  NOTAS = !!a.notas; ITENS = NOTAS ? 'notas' : 'pedidos';
  TODOS = achatar(D.empresas); ANT = achatar(D.anteriores); cortarAnterior();
  EMP = D.empresas.map(e => e.curta);
  TEM_ANT = D.anteriores.length > 0;
  EMP_ANT = new Set(D.anteriores.map(e => e.curta));   // ▲▼ só com as empresas que têm período anterior
  TEM_LIC = TODOS.some(p => p.lic);
  document.title = AREAS.length > 1 ? 'Painel de ' + AREAS.map(x => x.titulo.replace('Painel de ','')).join(' e ') : a.titulo;
  document.getElementById('relatorio').textContent = AREAS.map(x => '"' + x.relatorio + '"').join(' e ');
}
const comp = a => soma(a.filter(p => EMP_ANT.has(p.emp)));
function trocarPeriodo(k){ AREAS[areaAtual].pver = +k; const i = areaAtual; areaAtual = -1; trocarArea(i); }
function trocarArea(i){ if(i === areaAtual) return; usarArea(i); F.emp = null; F.vend.clear(); F.busca = ''; F.lic = false; Object.assign(est, {cli:null, menu:false, vab:null, vorig:null}); desenhar(); window.scrollTo(0,0); }

const F = {emp:null, vend:new Set(), busca:'', lic:false};
const est = {aba:0, porEmpresa:false, cli:null, menu:false, smenu:false, sub:0, vab:null, vorig:null};
// ---------- SALA DE VENDAS ----------
// vem com a seleção feita no programa; aqui dá para tirar/pôr vendedores (vale só nesta visualização)
const SALA_NOMES = {}; (DADOS.sala||[]).forEach(n => SALA_NOMES[norm(n)] = n);
const SALA = new Set(Object.keys(SALA_NOMES));
let EM_SALA = false;
function comSala(fn){
  const t = TODOS, a = ANT;
  TODOS = t.filter(p => SALA.has(p.vk)); ANT = a.filter(p => SALA.has(p.vk)); EM_SALA = true;
  [...F.vend].forEach(k => { if(!SALA.has(k)) F.vend.delete(k); });
  try { return fn(t); } finally { TODOS = t; ANT = a; EM_SALA = false; }
}
const VNOMES = {};   // chave -> nome, de todos os vendedores vistos
function togSala(k){ if(SALA.has(k)) SALA.delete(k); else { SALA.add(k); SALA_NOMES[k] = VNOMES[k] || k; } est.cli = null; desenhar(); }
function faixaSala(geral){
  const vs = Object.values(geral.reduce((m,p) => { (m[p.vk] = m[p.vk] || {k:p.vk, n:p.vend, t:0}).t += p.val; return m; }, {}));
  Object.keys(SALA_NOMES).forEach(k => { if(!vs.find(v => v.k === k)) vs.push({k, n:SALA_NOMES[k], t:0}); });
  vs.sort((a,b) => a.n.localeCompare(b.n));
  vs.forEach(v => VNOMES[v.k] = v.n);
  const dentro = vs.filter(v => SALA.has(v.k)), fora = vs.filter(v => !SALA.has(v.k));
  const tSala = soma(TODOS), tGeral = soma(geral);
  let h = '<div class="caixa sala"><div class="lin"><span class="rot">Sala de Vendas</span>';
  h += dentro.length ? dentro.map(v => `<span class="vchip">${esc(v.n)}<button title="Tirar da sala" onclick="togSala('${esc(v.k)}')">×</button></span>`).join('') : '<span class="sec">nenhum vendedor na sala</span>';
  h += `<div class="vsel ssel"><button onclick="est.smenu=!est.smenu;est.menu=false;desenhar()">+ Vendedores ▾</button>`;
  if(est.smenu) h += '<div class="vmenu">' + vs.map(v => `<label><input type="checkbox" ${SALA.has(v.k)?'checked':''} onchange="togSala('${esc(v.k)}')"> ${esc(v.n)}</label>`).join('') + '</div>';
  h += '</div></div>';
  h += `<div class="frase"><b>${dentro.length} vendedor${dentro.length===1?'':'es'} · ${R(tSala)}</b>${tGeral > 0 ? ` &nbsp;=&nbsp; ${P1(tSala/tGeral*100)}% do total das empresas (${R(tGeral)})` : ''}<span class="sec"> &nbsp;·&nbsp; tirar/pôr vendedor aqui vale só nesta visualização</span></div></div>`;
  return h;
}

function filtrar(peds, comVend, semEmp){
  const q = norm(F.busca);
  return peds.filter(p => (semEmp || !F.emp || p.emp === F.emp) && (!comVend || !F.vend.size || F.vend.has(p.vk)) && (!q || p.ck.includes(q)) && (!F.lic || p.lic));
}
const algum = () => F.emp || F.vend.size || F.busca.trim() || F.lic;

function variacao(atual, ant){
  if(!TEM_ANT) return null;
  if(ant < 0.005 && atual < 0.005) return null;
  if(ant < 0.005) return {t:'novo', c:'up'};
  const v = (atual/ant - 1) * 100;
  if(Math.abs(v) < 0.5) return {t:'= 0%', c:'neu'};
  return {t:(v>0?'▲ ':'▼ ') + (Math.abs(v) < 10 ? P1(Math.abs(v)) : Math.round(Math.abs(v))) + '%', c: v>0?'up':'down'};
}
const varHtml = (a,b) => { const v = variacao(a,b); return v ? `<span class="${v.c}">${v.t}</span>` : ''; };

function nomeVend(k){ const p = TODOS.find(x => x.vk === k); return p ? p.vend : k; }
function nomesEscolhidos(max){ const n = [...F.vend].map(nomeVend).sort(); return n.length <= max ? n.join(' e ') : n.slice(0,max).join(', ') + ' +' + (n.length-max); }

// ---------------- linha de filtros ("pílulas") ----------------
function filtros(){
  const vendLista = Object.values(filtrar(TODOS, false).reduce((m,p) => { (m[p.vk] = m[p.vk] || {k:p.vk, n:p.vend, t:0}).t += p.val; return m; }, {})).sort((a,b) => b.t-a.t);
  F.vend.forEach(k => { if(!vendLista.find(v => v.k === k)) vendLista.push({k, n:nomeVend(k), t:0}); });
  let h = '<div class="pills"><div class="vsel">';
  h += `<button class="pill ${F.vend.size?'on':''}" onclick="est.menu=!est.menu;est.smenu=false;desenhar()">Vendedores: <b>${F.vend.size ? esc(nomesEscolhidos(2)) : (EM_SALA ? 'todos da sala' : 'todos')}</b> ▾</button>`;
  if(est.menu) h += '<div class="vmenu">' + vendLista.map(v => `<label><input type="checkbox" ${F.vend.has(v.k)?'checked':''} onchange="togVend('${esc(v.k)}')"> ${esc(v.n)}</label>`).join('') + '</div>';
  h += '</div>';
  h += `<input type="search" id="busca" class="pill busca" placeholder="🔍 buscar cliente (razão social)" value="${esc(F.busca)}" oninput="F.busca=this.value;est.cli=null;desenhar(true)">`;
  h += `<label class="pill chk"><input type="checkbox" ${F.lic?'checked':''} onchange="F.lic=this.checked;est.cli=null;desenhar()"> só licitação</label>`;
  if(algum()){
    // a frase só aparece com filtro (sem filtro ela repetiria o número grande)
    const f = filtrar(TODOS, true), tot = soma(TODOS), tf = soma(f), partes = [];
    if(F.vend.size) partes.push(esc(nomesEscolhidos(3)));
    if(F.emp) partes.push(esc(F.emp));
    if(F.busca.trim()) partes.push(`clientes com “${esc(F.busca.trim())}”`);
    if(F.lic) partes.push('só licitação');
    h += `<button class="limpar" onclick="limpar()">Limpar filtros</button><span class="frase">Mostrando ${partes.join(' · ')} → <b>${f.length} ${ITENS} · ${R(tf)}</b>${tot > 0 ? ` (${P1(tf/tot*100)}% do total)` : ''}</span>`;
  }
  return h + '</div>';
}

// ---------------- número grande + empresas + licitação ----------------
function hero(){
  const semEmp = filtrar(TODOS, true, true), semEmpAnt = filtrar(ANT, true, true);
  const f = F.emp ? semEmp.filter(p => p.emp === F.emp) : semEmp, fa = F.emp ? semEmpAnt.filter(p => p.emp === F.emp) : semEmpAnt;
  const tot = soma(f), v = variacao(comp(f), soma(fa));
  const rot = algum() ? 'Total do filtro' : EM_SALA ? 'Total da sala de vendas' : `Total ${NOTAS?'faturado':'vendido'}${EMP.length > 1 ? ' · ' + EMP.length + ' empresas' : ''}`;
  let h = `<div class="hero ${TEM_LIC?'':'sem-lic'}"><div class="big"><div class="rot">${rot}</div>
    <div class="num">${R(tot)}${v ? ` <span class="var ${v.c}">${v.t}</span> <span class="vs">vs ${esc(COMP_TXT)}</span>` : ''}</div>
    <div class="det">${f.length} ${ITENS} · ${nCli(new Set(f.map(p => p.ck)).size)}</div>`;
  if(EMP.length > 1){
    const b = soma(semEmp);
    h += '<div class="share">' + EMP.map(e => { const s = soma(semEmp.filter(p => p.emp === e)); return s > 0 ? `<i title="${esc(e)}" style="flex:${(s/(b||1)).toFixed(4)} 1 0;background:${cor(e)};${F.emp && F.emp !== e ? 'opacity:.3' : ''}" onclick="setEmp(F.emp==='${esc(e)}'?null:'${esc(e)}')"></i>` : ''; }).join('') + '</div>';
    h += '<div class="leg">' + EMP.map(e => {
      const pe = semEmp.filter(p => p.emp === e), s = soma(pe), ap = F.emp && F.emp !== e;
      const ve = EMP_ANT.has(e) ? variacao(s, soma(semEmpAnt.filter(p => p.emp === e))) : null;
      return `<div class="${ap?'ap':''} ${F.emp===e?'on':''}" onclick="setEmp(F.emp==='${esc(e)}'?null:'${esc(e)}')"><div class="n"><span class="ponto" style="background:${cor(e)}"></span>${esc(e)} · ${b>0?P1(s/b*100):'0'}%</div>
        <div class="x">${R(s)}${ve ? ` <small class="${ve.c}">${ve.t}</small>` : ''}</div></div>`;
    }).join('') + '</div>';
  }
  h += '</div>';
  if(TEM_LIC){
    const l = f.filter(p => p.lic), sl = soma(l);
    h += `<div class="licc" onclick="F.lic=!F.lic;est.cli=null;desenhar()"><div class="rot">● Licitação (dentro do total)</div><div class="num2">${R(sl)}</div>
      <div class="det">${tot>0?P1(sl/tot*100)+'% do total · ':''}${l.length} ${ITENS} · ${nCli(new Set(l.map(p => p.ck)).size)}</div>
      <div class="lnk">${F.lic ? '✓ mostrando só licitação — tirar' : 'ver só licitação →'}</div></div>`;
  }
  return h + '</div>';
}

// ---------------- corpo: Vendedores | Clientes ----------------
function linhasVend(){
  const peds = filtrar(TODOS, false).filter(p => !F.vend.size || F.vend.has(p.vk)), ant = filtrar(ANT, false);
  const emps = F.emp ? [F.emp] : EMP, g = {};
  peds.forEach(p => (g[p.vk] = g[p.vk] || {k:p.vk, n:p.vend, ped:[]}).ped.push(p));
  return {emps, ant, linhas: Object.values(g).map(x => {
    const t = soma(x.ped), cl = {};
    x.ped.forEach(p => { (cl[p.ck] = cl[p.ck] || {n:p.cli, v:0}).v += p.val; });
    const top = Object.values(cl).sort((a,b) => b.v-a.v)[0];
    return Object.assign(x, {t, ncli:Object.keys(cl).length, princ: top.n + ' (' + Math.round(top.v/(t||1)*100) + '%)', ant: soma(ant.filter(p => p.vk === x.k)), c: comp(x.ped), pe: Object.fromEntries(emps.map(e => [e, soma(x.ped.filter(p => p.emp === e))]))});
  }).sort((a,b) => b.t - a.t)};
}

function corpo(){
  const sub = est.sub || 0;
  // caminho ("Todos os vendedores › FULANO › CLIENTE") ou dica
  let mig = '';
  if(sub === 0 && est.vab) mig = `<a onclick="est.vab=null;desenhar()">Todos os vendedores</a> › <b>${esc(nomeVend(est.vab))}</b>`;
  else if(sub === 1 && est.cli){
    const nc = esc((TODOS.find(p => p.ck === est.cli) || {cli:''}).cli);
    mig = est.vorig ? `<a onclick="est.sub=0;est.vab=null;est.cli=null;est.vorig=null;desenhar()">Todos os vendedores</a> › <a onclick="est.sub=0;est.vab=est.vorig;est.cli=null;est.vorig=null;desenhar()">${esc(nomeVend(est.vorig))}</a> › <b>${nc}</b>`
                    : `<a onclick="est.cli=null;desenhar()">Todos os clientes</a> › <b>${nc}</b>`;
  }
  else mig = `<span class="dica">${sub === 0 ? 'clique num vendedor para ver os clientes dele' : 'clique num cliente para ver os ' + ITENS}</span>`;
  const dir = sub === 0 ? `<div class="toggle"><button class="${!est.porEmpresa?'on':''}" onclick="est.porEmpresa=false;desenhar()">Ranking</button><button class="${est.porEmpresa?'on':''}" onclick="est.porEmpresa=true;desenhar()">Por empresa</button></div>` : '';
  let h = `<div class="corpo"><div class="ch"><div class="tabs2">${['Vendedores','Clientes'].map((t,i) => `<button class="${i===sub?'on':''}" onclick="est.sub=${i};est.cli=null;est.vorig=null;desenhar()">${t}</button>`).join('')}</div>
    <div class="mig">${mig}</div>${dir}</div>`;
  h += sub === 0 ? vendedores() : clientes();
  return h + '</div>';
}

function vendedores(){
  const {emps, ant, linhas} = linhasVend();
  if(!linhas.length) return '<p class="exp">Nenhuma venda com estes filtros.</p>';
  if(est.porEmpresa){
    const max = Math.max(...linhas.flatMap(l => emps.map(e => l.pe[e])), 1);
    let h = `<div class="tabela" style="max-height:none;border:0"><table><tr><th></th><th>Vendedor</th>${emps.map(e => `<th class="n">${esc(e)}</th>`).join('')}<th class="n">Total</th>${TEM_ANT?'<th class="n">vs ant.</th>':''}</tr>`;
    linhas.forEach((l,i) => {
      h += `<tr class="clic" onclick="est.porEmpresa=false;est.vab='${esc(l.k)}';desenhar()"><td class="pos">${i+1}</td><td>${esc(l.n)}</td>` + emps.map(e => {
        const v = l.pe[e], a = v > 0 ? 0.1 + 0.6 * v / max : 0;
        return `<td class="n">${v > 0 ? `<span class="heat" style="background:rgba(42,120,214,${a.toFixed(2)});${v/max > .6 ? 'color:#fff' : ''}">${R(v)}</span>` : '—'}</td>`;
      }).join('') + `<td class="n"><b>${R(l.t)}</b></td>${TEM_ANT?`<td class="n var">${varHtml(l.c, l.ant)}</td>`:''}</tr>`;
    });
    return h + '</table></div>';
  }
  const max = linhas[0].t;
  let h = '<div class="lista">';
  linhas.forEach((l,i) => {
    const ab = est.vab === l.k;
    const segs = emps.map(e => l.pe[e] > 0 ? `<i style="flex:${(l.pe[e]/l.t).toFixed(4)} 1 0;background:${cor(e)}"></i>` : '').join('');
    const dica = `${l.ped.length} ${ITENS} · ${nCli(l.ncli)} · principal: ${l.princ}` + (emps.length > 1 ? '\n' + emps.filter(e => l.pe[e] > 0).map(e => e + ' ' + R(l.pe[e])).join(' · ') : '');
    h += `<div class="vl ${ab?'ab':''}" title="${esc(dica)}" onclick="est.vab=${ab?'null':`'${esc(l.k)}'`};desenhar()"><span class="pos">${i+1}</span><span class="nm">${esc(l.n)}${ab?' ▾':''}</span>
      <span class="trilho"><span class="seg" style="width:${(l.t/max*100).toFixed(2)}%">${segs}</span></span><span class="v">${R(l.t)}</span><span class="var">${varHtml(l.c, l.ant)}</span></div>`;
    if(ab) h += bloco(l, emps, ant);
  });
  return h + '</div>';
}

// clientes do vendedor aberto, logo abaixo dele
function bloco(l, emps, ant){
  const g = {};
  l.ped.forEach(p => { const c = g[p.ck] = g[p.ck] || {k:p.ck, n:p.cli, v:0, q:0, lic:false, ped:[]}; c.v += p.val; c.q++; c.lic = c.lic || p.lic; c.ped.push(p); });
  const cls = Object.values(g).sort((a,b) => b.v-a.v), MAX = 8;
  let h = `<div class="bloco"><div class="info">${l.ped.length} ${ITENS} · ${nCli(cls.length)}${emps.length > 1 ? ' · ' + emps.filter(e => l.pe[e] > 0).map(e => esc(e) + ' ' + R(l.pe[e])).join(' · ') : ''}</div>`;
  cls.slice(0, MAX).forEach(c => {
    const a = soma(ant.filter(p => p.vk === l.k && p.ck === c.k));
    h += `<div class="cl ${c.lic?'lic':''}" onclick="est.sub=1;est.cli='${esc(c.k)}';est.vorig='${esc(l.k)}';desenhar()"><span class="nm">${esc(c.n)}${c.lic?' (licitação)':''}${c.q > 1 ? ` <small>${c.q} ${NOTAS?'NF':'ped.'}</small>` : ''}</span>
      <span class="pc">${Math.round(c.v/(l.t||1)*100)}%</span><span class="v">${R(c.v)}</span><span class="var">${a > 0.005 ? varHtml(comp(c.ped), a) : ''}</span></div>`;
  });
  if(cls.length > MAX) h += `<button class="mais" onclick="F.vend=new Set(['${esc(l.k)}']);est.sub=1;est.cli=null;est.vab=null;desenhar()">+ ${cls.length - MAX} clientes — ver todos os clientes de ${esc(l.n.split(' ')[0])}</button>`;
  return h + '</div>';
}

// ---------------- aba Clientes / pedidos ----------------
function clientes(){
  const f = filtrar(TODOS, true);
  if(est.cli && !f.some(p => p.ck === est.cli)){ est.cli = null; est.vorig = null; }
  if(!est.cli){
    const g = {};
    f.forEach(p => { const c = g[p.ck] = g[p.ck] || {k:p.ck, nomes:{}, vend:{}, ped:0, val:0, lic:false}; c.nomes[p.cli] = (c.nomes[p.cli]||0)+1; c.vend[p.vend] = (c.vend[p.vend]||0)+p.val; c.ped++; c.val += p.val; c.lic = c.lic || p.lic; });
    const cls = Object.values(g).map(c => Object.assign(c, {nome:Object.entries(c.nomes).sort((a,b)=>b[1]-a[1])[0][0], vs:Object.entries(c.vend).sort((a,b)=>b[1]-a[1]).map(x => x[0].split(' ')[0])})).sort((a,b) => b.val-a.val);
    const tot = soma(f), ant = filtrar(ANT, true);
    let h = `<div class="exp" style="margin:2px 0 8px">${nCli(cls.length)} · ${R(tot)}</div><div class="tabela"><table><tr><th>Cliente</th><th>Vendedor(es)</th><th class="n">Valor</th><th class="n"></th><th class="n">%</th></tr>`;
    cls.forEach(c => {
      const a = soma(ant.filter(p => p.ck === c.k));   // ▲▼ só para quem também comprou antes
      h += `<tr class="clic ${c.lic?'lic':''}" onclick="est.cli='${esc(c.k)}';est.vorig=null;desenhar()"><td>${esc(c.nome)}${c.ped > 1 ? ` <small class="sec">${c.ped} ${NOTAS?'NF':'ped.'}</small>` : ''}${c.lic?' (licitação)':''}</td><td>${esc(c.vs.slice(0,3).join(', '))}${c.vs.length>3?' +'+(c.vs.length-3):''}</td><td class="n">${R(c.val)}</td><td class="n var">${a > 0.005 ? varHtml(comp(f.filter(p => p.ck === c.k)), a) : ''}</td><td class="n">${tot>0?P1(c.val/tot*100):'0'}%</td></tr>`;
    });
    return h + '</table></div>';
  }
  let peds = f.filter(p => p.ck === est.cli && (!est.vorig || p.vk === est.vorig));
  if(!peds.length){ est.vorig = null; peds = f.filter(p => p.ck === est.cli); }
  peds.sort((a,b) => a.data.split('/').reverse().join('').localeCompare(b.data.split('/').reverse().join('')));
  const lic = peds.some(p => p.lic);
  let h = `<div class="exp" style="margin:2px 0 8px;${lic?'color:var(--lic)':''}">${lic?'Licitação · ':''}${peds.length} ${ITENS} · ${R(soma(peds))} · ${[...new Set(peds.map(p => p.emp))].join(', ')}</div>`;
  h += `<div class="tabela"><table><tr><th>Empresa</th><th>${NOTAS?'Nota':'Pedido'}</th><th>Data</th><th>Vendedor</th>${NOTAS?'':'<th class="n">Quantidade</th>'}<th class="n">Valor</th></tr>`;
  peds.forEach(p => h += `<tr class="${p.lic?'lic':''}"><td>${esc(p.emp)}</td><td>${esc(p.num)}</td><td>${esc(p.data)}</td><td>${esc(p.vend)}</td>${NOTAS?'':`<td class="n">${Q(p.qtd)}</td>`}<td class="n">${R(p.val)}</td></tr>`);
  return h + '</table></div>';
}

function conferencia(emps){
  const d = {emps};
  let prob = 0, linhas = '';
  d.emps.forEach(e => {
    let soma = 0, np = 0;
    e.vend.forEach(v => {
      const atual = v.p.reduce((s,p)=>s+p[5],0); soma += atual; np += v.p.length;
      if(v.m){ linhas += `<tr style="color:#6250D6"><td>${esc(e.curta)}</td><td>${esc(v.n)} (criado no programa)</td><td class="n">${v.p.length}</td><td class="n">${R(atual)}</td><td class="n">—</td><td></td><td>recebeu licitações</td></tr>`; return; }
      const t = v.tl != null ? v.tl : atual;   // compara com o que veio no PDF, antes das licitações
      const ok = v.ti == null ? null : Math.abs(t - v.ti) < 0.005; if(ok === false) prob++;
      const rec = v.p.filter(p => p[6] && p[7]).reduce((s,p)=>s+p[5],0);
      const extra = (v.tr > 0.004 ? ' · ' + R(v.tr) + ' foi p/ licitação' : '') + (rec > 0.004 ? ' · recebeu ' + R(rec) + ' de licitação' : '');
      linhas += `<tr><td>${esc(e.curta)}</td><td>${esc((v.c?v.c+' - ':'')+v.n)}</td><td class="n">${v.p.filter(p => !(p[6] && p[7])).length + e.vend.reduce((s,x)=>s+x.p.filter(p => p[6] && p[7] === v.n).length,0)}</td><td class="n">${R(t)}</td><td class="n">${v.ti==null?'—':R(v.ti)}</td><td class="n">${v.ti==null?'—':R(t-v.ti)}</td><td class="${ok?'ok':ok===false?'erro':''}">${ok==null?'sem total no relatório':ok?'✓ confere':'⚠ diferente'}${extra}</td></tr>`;
    });
    (e.sv||[]).forEach(v => {
      const t = v.p.reduce((s,p)=>s+p[5],0); soma += t; np += v.p.length;
      linhas += `<tr style="color:var(--sec);font-style:italic"><td>${esc(e.curta)}</td><td>Sem vendedor${v.c ? ' (código '+esc(v.c)+')' : ''}</td><td class="n">${v.p.length}</td><td class="n">${R(t)}</td><td class="n">${v.ti==null?'—':R(v.ti)}</td><td></td><td>desconsiderado no painel</td></tr>`;
    });
    const okg = e.ti == null ? false : Math.abs(soma - e.ti) < 0.005; if(!okg) prob++;
    linhas += `<tr class="tot"><td>${esc(e.curta)}</td><td>TOTAL GERAL${(e.sv||[]).length?' (com os sem vendedor)':''}</td><td class="n">${np}</td><td class="n">${R(soma)}</td><td class="n">${e.ti==null?'—':R(e.ti)}</td><td class="n">${e.ti==null?'—':R(soma-e.ti)}</td><td class="${okg?'ok':'erro'}">${e.ti==null?'TOTAL GERAL não encontrado':okg?'✓ confere':'⚠ diferente'}</td></tr>`;
  });
  const fora = d.emps.reduce((s,e) => s + (e.sv||[]).reduce((a,v) => a + v.p.reduce((b,p)=>b+p[5],0), 0), 0);
  if(d.emps.length > 1){
    const somaP = d.emps.reduce((s,e) => s + e.vend.reduce((a,v) => a + v.p.reduce((b,p)=>b+p[5],0), 0), 0);
    const nP = d.emps.reduce((s,e) => s + e.vend.reduce((a,v) => a + v.p.length, 0), 0);
    const inf = d.emps.every(e => e.ti != null) ? d.emps.reduce((s,e)=>s+e.ti,0) : null;
    linhas += `<tr class="tot" style="background:var(--azulc)"><td>SOMA</td><td>TOTAL DAS ${d.emps.length} EMPRESAS (painel, sem os sem vendedor)</td><td class="n">${nP}</td><td class="n">${R(somaP)}</td><td class="n">${inf==null?'—':R(inf)}</td><td></td><td></td></tr>`;
  }
  const extraFora = fora > 0.004 ? `   Sem vendedor (fora do painel): ${R(fora)}.` : '';
  const faixa = prob === 0 ? `<div class="faixa ok">✓ Tudo confere: a soma ${NOTAS?'das notas lidas':'dos pedidos lidos'} bate com os totais impressos nos relatórios.${extraFora}</div>`
                           : `<div class="faixa erro">⚠ ${prob} total(is) não bate(m) com o relatório.</div>`;
  return {prob, html: `<p class="exp">Confere se a leitura dos PDFs está certa: para cada empresa, a soma ${NOTAS?'das notas lidas':'dos pedidos lidos'} tem que bater com o total impresso no relatório.</p>` + faixa + `<div class="tabela"><table><tr><th>Empresa</th><th>Vendedor</th><th class="n">Pedidos lidos</th><th class="n">Soma dos pedidos</th><th class="n">Total no relatório</th><th class="n">Diferença</th><th>Situação</th></tr>${linhas}</table></div>` +
         `<p style="color:var(--sec)">Arquivos lidos: ${d.emps.map(e => esc(e.curta)+' — '+esc(e.arquivo)+' ('+esc(e.periodo)+')').join(' · ')}</p>`};
}

function setEmp(e){ F.emp = e; est.cli = null; est.vorig = null; desenhar(); }
function togVend(k){ if(F.vend.has(k)) F.vend.delete(k); else F.vend.add(k); est.cli = null; desenhar(); }
function limpar(){ F.emp = null; F.vend.clear(); F.busca = ''; F.lic = false; est.cli = null; est.vorig = null; est.menu = false; desenhar(); }

function desenhar(manterBusca){
  document.getElementById('areas').innerHTML = AREAS.length > 1
    ? AREAS.map((a,i) => `<span class="ar ${i===areaAtual?'on':''}" onclick="trocarArea(${i})">${esc(a.titulo.replace('Painel de ',''))}</span>`).join('')
    : esc(AREAS[0].titulo);
  const conf = conferencia(D.empresas);
  document.getElementById('abas').innerHTML = ['Painel','Sala de Vendas','Conferência'].map((a,i) => `<button class="${i===est.aba?'on':''}" onclick="est.aba=${i};est.menu=false;est.smenu=false;est.cli=null;est.vorig=null;desenhar()">${a}</button>`).join('');
  const selo = document.getElementById('selo');
  selo.hidden = false; selo.className = 'selo ' + (conf.prob ? 'erro' : 'ok');
  selo.textContent = conf.prob ? `⚠ ${conf.prob} total(is) não bate(m)` : '✓ tudo confere';
  selo.title = EMP.join(' + ') + (D.gerado ? '\ngerado em ' + D.gerado : '') + '\nclique para abrir a Conferência';
  selo.onclick = () => { est.aba = 2; desenhar(); };
  const per = [...new Set(D.empresas.map(e => e.periodo).filter(Boolean))], perAnt = [...new Set((D.anteriores||[]).map(e => e.periodo).filter(Boolean))];
  document.getElementById('sub').textContent = [per.length ? 'Período ' + per.join(' / ') : '', perAnt.length ? '▲▼ comparado com ' + COMP_TXT : ''].filter(Boolean).join('   ·   ');
  const al = document.getElementById('alerta');
  if(EMP.length > 1 && per.length > 1){ al.hidden = false; al.textContent = '⚠ Atenção: os PDFs têm períodos diferentes — ' + D.empresas.map(e => e.curta + ' ' + e.periodo).join('  ·  '); } else al.hidden = true;
  const painelHtml = () => filtros() + hero() + corpo();
  document.getElementById('conteudo').innerHTML = est.aba === 0 ? painelHtml()
    : est.aba === 1 ? comSala(geral => faixaSala(geral) + (SALA.size ? painelHtml() : ''))
    : conf.html;
  if(manterBusca){ const b = document.getElementById('busca'); if(b){ b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }
}
document.addEventListener('click', e => { if((est.menu || est.smenu) && !e.target.closest('.vsel')){ est.menu = false; est.smenu = false; desenhar(); } });
usarArea(Math.min(DADOS.inicial||0, AREAS.length-1));
desenhar();
</script>
</body>
</html>
